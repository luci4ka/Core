plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.terracraft'
version = '1.0.2'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://raw.githubusercontent.com/CarmJos/MineSQL/repo/' }
    maven { url = 'https://repo.carm.cc/repository/maven-public/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
}

dependencies {
    // Paper API
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'

    // Compile-only
    compileOnly 'dev.jorel:commandapi-paper-core:12.1.0'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly "cc.carm.plugin:minesql-api:1.4.2"
    compileOnly 'cc.carm.lib:easysql-api:0.4.7'

    implementation 'de.exlll:configlib-yaml:4.8.1'
    implementation 'com.github.ez-plugins:mc-plugin-update-notifier:1.0.0'
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'dev.jorel:commandapi-paper-core:12.1.0'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        exceptionFormat 'full'
    }
}

def targetJavaVersion = 25

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')

    relocate 'org.bstats',           'ru.terracraft.core.libs.bstats'
    relocate 'de.exlll.configlib',   'ru.terracraft.core.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.terracraft.core.libs.updater'


    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'

    mergeServiceFiles()
}

tasks.named('jar') {
    enabled = false
}

build.dependsOn shadowJar
