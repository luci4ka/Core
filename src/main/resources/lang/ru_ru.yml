# ============================================================
#  TerraCore — русский язык (ru_ru)
#  Формат: "key": "MiniMessage value"
#  Ключи с точками ОБЯЗАТЕЛЬНО в кавычках.
#
#  Палитра:
#    <gradient:#00d4ff:#7b2ff7>  — фирменный градиент (только prefix)
#    <aqua>        — акцент (имена игроков, мира, координаты)
#    <green>       — успех
#    <yellow>      — предупреждение / шанс
#    <red>         — ошибка
#    <gold>        — выделение значений (числа, количества)
#    <gray>        — вторичный текст
#    <dark_gray>   — служебные разделители, UUID, IP
# ============================================================

