# ============================================================
#  TerraCore — English (en_us)
#  Format: "key": "MiniMessage value"
#  Keys with dots MUST be quoted.
#
#  Palette:
#    <gradient:#00d4ff:#7b2ff7>  — brand gradient (prefix only)
#    <aqua>        — accent (player names, world, coords)
#    <green>       — success
#    <yellow>      — warning / chance
#    <red>         — error
#    <gold>        — highlighted values (numbers, counts)
#    <gray>        — secondary text
#    <dark_gray>   — dividers, UUID, IP
# ============================================================

